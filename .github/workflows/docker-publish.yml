name: Build and Publish Docker Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tentacles
          POSTGRES_USER: tentacles_test
          POSTGRES_PASSWORD: tentacles_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tentacles_test -d tentacles"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tentacles
          SPRING_DATASOURCE_USERNAME: tentacles_test
          SPRING_DATASOURCE_PASSWORD: tentacles_test_password
        run: bash ./gradlew test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/eiredrake/survey_tentacles:${{ steps.version.outputs.VERSION }}
            ghcr.io/eiredrake/survey_tentacles:${{ github.ref_name }}
            ghcr.io/eiredrake/survey_tentacles:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true