<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Survey - Tentacles</title>
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">        
    <link rel="stylesheet" href="/css/tentacles.css">
    <link rel="stylesheet" href="/css/toast.css">
</head>

<body>
    <main>
        <a href="/">← Surveys</a>

        <div class="editor-title">
          <h1 id="survey-title">Edit Survey</h1>
      
          <button
              id="edit-title-button"
              class="icon-button"
              type="button"
              title="Edit survey title"
              aria-label="Edit survey title"
          >
              <i class="fa-solid fa-pen-to-square"></i>
          </button>
        </div>

        <div id="survey-editor">
          Loading survey...
        </div>
      
        <section id="scheduling-question-editor">
            <h2>Add Scheduling Question</h2>
        
            <form id="scheduling-question-form">
                <label>
                    Question
                    <input
                        id="scheduling-question-prompt"
                        type="text"
                        required
                    >
                </label>
        
                <button type="submit">Add Scheduling Question</button>
            </form>
        </section>
    </main>

    <script src="/js/toast.js"></script>
    <script src="/js/survey-edit.js"></script>
</body>
</html>
