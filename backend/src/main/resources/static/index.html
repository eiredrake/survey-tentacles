<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tentacles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">    
    <link rel="stylesheet" href="/css/tentacles.css">    
</head>

<body>
    <main>
        <header class="app-header">
            <div class="app-title">Tentacles Survey System</div>
        
            <div class="app-user">
                <span>User:</span>
                <span id="user">Loading user...</span>
        
                <button
                    id="logout-button"
                    class="icon-button"
                    type="button"
                    title="Logout"
                >
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>
        
        <hr class="app-divider">

        <h2>Surveys</h2>
        <form id="create-survey-form">
            <input
                id="create-survey-title"
                type="text"
                placeholder="Survey title"
                required
            >
            <button type="submit">Create Survey</button>
        </form>

        <div id="surveys">
            Loading surveys...
        </div>
    </main>

    <script src="/js/index.js"></script>
</body>
</html>
