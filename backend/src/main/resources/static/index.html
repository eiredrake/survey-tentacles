<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tentacles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">    
    <link rel="stylesheet" href="/css/tentacles.css">
    <link rel="stylesheet" href="/css/toast.css"> 
</head>

<body>
    <main>
        <header class="app-header">
            <div class="app-title">Tentacles Survey System</div>
        
            <div class="app-user">
                <span>User:</span>
                <span id="user">Loading user...</span>
        
                <button
                    id="logout-button"
                    class="icon-button"
                    type="button"
                    title="Logout"
                >
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>
        
        <hr class="app-divider">

        <section class="survey-section">
            <div class="section-heading">
                <h2>Active Surveys</h2>
            
                <button
                    id="create-survey-button"
                    class="icon-button"
                    type="button"
                    title="Create survey"
                    aria-label="Create survey"
                >
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        
            <table class="survey-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Required</th>
                        <th class="status-heading">Status</th>
                        <th class="actions-column">Actions</th>
                    </tr>
                </thead>
                <tbody id="active-surveys">
                    <tr>
                        <td colspan="4">Loading surveys...</td>
                    </tr>
                </tbody>
            </table>
        </section>
        
        <details class="survey-section inactive-surveys-section">
            <summary class="section-heading inactive-surveys-summary">
                <h2>Inactive Surveys</h2>

                <i class="fa-solid fa-chevron-right inactive-surveys-chevron"></i>
            </summary>
        
            <table class="survey-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Required</th>
                        <th class="status-heading">Status</th>
                        <th class="actions-column">Actions</th>
                    </tr>
                </thead>
                <tbody id="inactive-surveys">
                    <tr>
                        <td colspan="4">Loading surveys...</td>
                    </tr>
                </tbody>
            </table>
        </details>

    </main>

    <script src="/js/toast.js"></script>
    <script src="/js/index.js"></script>
    <script src="/js/logout.js"></script>

</body>
</html>
