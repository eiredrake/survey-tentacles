<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey - Tentacles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" >
    <link rel="stylesheet" href="/css/toast.css">
    <link rel="stylesheet" href="/css/tentacles.css">
</head>

<body>
    <main>
        <header class="app-header">
            <div class="app-title">Tentacles Survey System</div>
        
            <div class="app-user">
                <span>User:</span>
                <span id="user">Loading user...</span>
        
                <button
                    id="logout-button"
                    class="icon-button"
                    type="button"
                    title="Logout"
                    aria-label="Logout"
                >
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>
        
        <hr class="app-divider">
        
        <div class="survey-page-heading">
            <a href="/">← Surveys</a>
            <h1 id="survey-title">Survey</h1>
        </div>

        <div id="questions">
            Loading questions...
        </div>
    </main>

        <template id="scheduling-participant-template">
            <section class="survey-question">
                <h2 class="question-prompt"></h2>
        
                <div class="scheduling-options"></div>
        
                <div class="question-actions">
                    <button
                        type="button"
                        class="submit-answer-button"
                    >
                        Submit
                    </button>
                </div>
        
                <div class="scheduling-status"></div>
            </section>
        </template>    

    <script src="/js/toast.js"></script>
    <script src="/js/survey.js"></script>
</body>
</html>
