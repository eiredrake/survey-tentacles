# Tests use their own database and stub OIDC endpoints; never load the deployment .env.
spring.application.name=tentacles-test
spring.datasource.url=jdbc:h2:mem:tentacles-tests;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.security.oauth2.client.registration.authentik.client-id=test-client
spring.security.oauth2.client.registration.authentik.client-secret=test-secret
spring.security.oauth2.client.registration.authentik.scope=openid,profile,email
spring.security.oauth2.client.registration.authentik.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.authentik.authorization-uri=http://localhost/unused/authorize
spring.security.oauth2.client.provider.authentik.token-uri=http://localhost/unused/token
spring.security.oauth2.client.provider.authentik.jwk-set-uri=http://localhost/unused/jwks
spring.security.oauth2.client.provider.authentik.user-info-uri=http://localhost/unused/userinfo
spring.security.oauth2.client.provider.authentik.user-name-attribute=sub
tentacles.public-base-url=http://localhost:8081
tentacles.upload-dir=build/test-uploads
tentacles.require-persistent-uploads=false
spring.security.oauth2.client.registration.authentik.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
